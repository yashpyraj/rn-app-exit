name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `prepare` runs bob build, so this also proves the package builds.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify build output
        run: |
          test -d lib/commonjs || { echo "::error::lib/commonjs missing"; exit 1; }
          test -d lib/module   || { echo "::error::lib/module missing";   exit 1; }
          test -d lib/typescript || { echo "::error::lib/typescript missing"; exit 1; }
          echo "build output present"
